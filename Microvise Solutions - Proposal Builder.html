<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Microvise Solutions — Proposal Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --navy:#2D3C61;
    --blue:#2674AF;
    --light-blue:#EAF1F8;
    --card-border:#C9D3E0;
    --gray:#6B6B6E;
    --ink:#232323;
    --bg:#EEF1F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', Calibri, Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  .app{
    display:flex;
    height:100vh;
  }

  /* ---------- CONTROLS PANEL ---------- */
  .controls{
    width:400px;
    flex:0 0 400px;
    background:#fff;
    border-right:1px solid #dfe3ea;
    overflow-y:auto;
    padding:0 0 40px 0;
  }
  .controls-header{
    background:var(--navy);
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:5;
  }
  .controls-header img{ height:28px; display:block; margin-bottom:8px; filter:brightness(0) invert(1); }
  .controls-header h1{ font-size:15px; margin:0; font-weight:600; letter-spacing:.3px;}
  .controls-header p{ font-size:11.5px; margin:3px 0 0; color:#c9d6e8; }

  .panel-section{ padding:16px 20px; border-bottom:1px solid #eef0f4; }
  .panel-section h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--blue); margin:0 0 12px; font-weight:700;
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--gray); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea{
    width:100%; padding:8px 10px; font-size:13.5px; border:1px solid #d3d8e0; border-radius:5px;
    font-family:inherit; color:var(--ink); background:#fbfcfe;
  }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue); }
  .field textarea{ resize:vertical; min-height:52px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:11px; color:#9aa1ac; margin-top:3px; }

  .scope-toolbar{ display:flex; gap:8px; margin-bottom:10px; }
  .mini-btn{
    font-size:11.5px; padding:5px 10px; border-radius:4px; border:1px solid var(--card-border);
    background:#fff; color:var(--navy); cursor:pointer; font-weight:600;
  }
  .mini-btn:hover{ background:var(--light-blue); }

  .sec-row{ border:1px solid #e6e9ef; border-radius:6px; margin-bottom:8px; overflow:hidden; }
  .sec-head{ display:flex; align-items:center; gap:8px; padding:9px 10px; background:#f7f9fc; cursor:pointer; }
  .sec-head input[type=checkbox]{ accent-color:var(--blue); width:16px; height:16px; flex:0 0 auto; }
  .sec-head .sec-title{ font-size:13px; font-weight:600; color:var(--navy); flex:1; }
  .sec-head .chev{ font-size:11px; color:var(--gray); transition:transform .15s; }
  .sec-head.open .chev{ transform:rotate(90deg); }
  .sec-body{ display:none; padding:6px 10px 10px 34px; }
  .sec-body.open{ display:block; }
  .item-row{ display:flex; align-items:flex-start; gap:7px; padding:4px 0; }
  .item-row input[type=checkbox]{ accent-color:var(--blue); width:14px; height:14px; margin-top:2px; flex:0 0 auto; }
  .item-row label{ font-size:12.5px; color:#444; line-height:1.4; cursor:pointer; }
  .sub-title{ font-size:12.5px; font-weight:700; color:var(--blue); margin:8px 0 2px; }

  .custom-wrap{ margin-top:4px; padding-top:6px; border-top:1px dashed #e2e6ec; }
  .custom-item-row{ position:relative; padding-right:22px; }
  .custom-del-btn{
    position:absolute; right:0; top:1px; background:none; border:none; color:#b3392c;
    font-size:15px; line-height:1; cursor:pointer; padding:0 3px; font-weight:700;
  }
  .custom-del-btn:hover{ color:#7a2419; }
  .custom-add-row{ display:flex; gap:6px; margin-top:6px; }
  .custom-add-row input[type=text]{
    flex:1; padding:6px 8px; font-size:12px; border:1px solid #d3d8e0; border-radius:4px;
    font-family:inherit; background:#fbfcfe;
  }
  .custom-add-row input[type=text]:focus{ outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue); }
  .custom-add-btn{
    font-size:11.5px; padding:0 10px; border-radius:4px; border:1px solid var(--blue);
    background:#fff; color:var(--blue); cursor:pointer; font-weight:700; white-space:nowrap;
  }
  .custom-add-btn:hover{ background:var(--blue); color:#fff; }

  .pay-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .pay-row input[type=text]{ flex:1; }
  .pay-row input[type=number]{ width:66px; text-align:right; }
  .pay-sum{ font-size:11.5px; margin-top:2px; }
  .pay-sum.ok{ color:#2a7a3b; }
  .pay-sum.bad{ color:#b3392c; }

  .print-btn{
    display:block; width:100%;
    background:var(--blue); color:#fff; border:none; padding:12px; border-radius:6px;
    font-size:14px; font-weight:700; cursor:pointer; letter-spacing:.2px;
  }
  .print-btn:hover{ opacity:.9; }
  .print-hint{ font-size:11px; color:#9aa1ac; }

  /* ---------- PREVIEW ---------- */
  .preview-wrap{ flex:1; overflow-y:auto; padding:32px; }
  .page{
    width:210mm; min-height:297mm; margin:0 auto 32px; background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.12); padding:14mm 12mm; position:relative;
  }
  .doc-header td{ vertical-align:middle; border-bottom:1px solid #d9dde3; padding-bottom:12px; }
  .doc-header img{ height:42px; }
  .doc-header .refline{ font-size:11px; color:#555; }
  .doc-header .refline b{ color:var(--navy); }

  .addr-block{ font-size:12.5px; line-height:1.55; margin:16px 0 14px; }
  .addr-block .cname{ font-weight:700; }

  .subject-line{ font-size:12px; margin:0 0 16px; line-height:1.5; }
  .subject-line b{ text-decoration:underline; }

  .body-text{ font-size:12.5px; text-align:justify; line-height:1.6; margin-bottom:10px; }

  h2.sec-heading{
    font-size:13.5px; font-weight:700; color:var(--navy);
    border-bottom:1px solid var(--navy); padding-bottom:5px;
    margin:24px 0 10px;
  }
  h2.sec-heading .n{ color:var(--blue); margin-right:6px; }

  h3.sub-heading{ font-size:12px; font-weight:700; color:var(--blue); margin:13px 0 5px; }

  ul.scope-list{ margin:0 0 4px; padding-left:19px; }
  ul.scope-list li{ font-size:12px; text-align:justify; line-height:1.55; margin-bottom:5px; color:var(--ink); }
  ul.scope-list li::marker{ color:#a9b2c0; }

  .fee-line{ font-size:12.5px; line-height:1.6; margin:6px 0 16px; text-align:justify; }
  .fee-line .amt{ font-weight:700; color:var(--navy); }

  table.pay-table{ width:100%; border-collapse:collapse; margin:6px 0 4px; font-size:12px; }
  table.pay-table th{ background:#EEF1F6; color:var(--navy); text-align:left; padding:7px 10px; font-size:11px; font-weight:700; border-bottom:1.5px solid var(--navy); }
  table.pay-table th:last-child, table.pay-table td:last-child{ text-align:right; }
  table.pay-table td{ padding:7px 10px; border-bottom:1px solid #eee; }

  .visits-line{ font-size:12.5px; margin-top:9px; }

  table.sign-grid{ width:100%; margin-top:32px; }
  table.sign-grid td{ width:50%; vertical-align:top; padding-right:16px; }
  table.sign-grid td.right{ padding-right:0; padding-left:16px; }
  .sign-who{ font-weight:700; color:var(--navy); font-size:12.5px; border-bottom:1px solid var(--navy); padding-bottom:16px; margin:0 0 14px; }
  .sign-line{ font-size:12px; margin-bottom:6px; }

  table.doc-footer{ width:100%; margin-top:28px; }
  table.doc-footer td{ background:var(--navy); color:#fff; font-size:10px; text-align:center; padding:8px 10px; }
  .empty-note{ font-size:12.5px; color:#b3392c; background:#fdf0ee; border:1px dashed #e2a89f; padding:10px 14px; border-radius:4px; }

  @media print{
    body{ background:#fff; }
    .controls{ display:none !important; }
    .preview-wrap{ padding:0; overflow:visible; }
    .page{ box-shadow:none; margin:0; width:auto; min-height:0; padding:10mm 12mm; }
    @page{ size:A4; margin:0; }
  }
  @media (max-width: 900px){
    .app{ flex-direction:column; height:auto; }
    .controls{ width:100%; flex:none; max-height:60vh; }
    .page{ width:100%; padding:6mm; }
  }
</style>
</head>

      <h1>Proposal Builder</h1>

    <div class="panel-section">
      <h2>Quote Details</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-ref">Quote / Ref No.</label>
          <input type="text" id="f-ref" placeholder="e.g. Microvise 26/27-8/01">
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input type="date" id="f-date">
        </div>
      </div>
      <div class="field">
        <label for="f-cname">Customer Name</label>
        <input type="text" id="f-cname" placeholder="e.g. ABC Pharma Pvt. Ltd.">
      </div>
      <div class="field">
        <label for="f-caddr">Customer Address / Location</label>
        <textarea id="f-caddr" placeholder="Plot No., Road No., GIDC / Area, City – PIN, State."></textarea>
      </div>
      <div class="field">
        <label for="f-title">Project Title (used in Subject line)</label>
        <input type="text" id="f-title" placeholder="e.g. Formulation Plant Design – New Building">
      </div>
      <div class="field">
        <label for="f-area">Plot / Site Area <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="f-area" placeholder="e.g. 2,050 Sq. M.">
      </div>
    </div>

    <div class="panel-section">
      <h2>Commercial</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-cost">Total Project Cost (₹)</label>
          <input type="number" id="f-cost" min="0" step="1000" placeholder="e.g. 1551000">
        </div>
        <div class="field">
          <label for="f-visits">No. of Site Visits</label>
          <input type="number" id="f-visits" min="0" step="1" placeholder="e.g. 10">
        </div>
      </div>

      <label style="display:block; font-size:12.5px; color:var(--gray); font-weight:600; margin:10px 0 6px;">Payment Milestones</label>
      <div id="pay-rows"></div>
      <div class="pay-sum" id="pay-sum"></div>
    </div>

    <div class="panel-section">
      <h2>Scope of Work</h2>
      <div class="scope-toolbar">
        <button class="mini-btn" id="btn-select-all">Select all</button>
        <button class="mini-btn" id="btn-clear-all">Clear all</button>
        <button class="mini-btn" id="btn-expand-all">Expand all</button>
      </div>
      <div id="scope-tree"></div>
    </div>

    <div class="panel-section" style="border-bottom:none;">
      <h2>Export</h2>
      <button class="print-btn" id="btn-word" style="background:var(--navy); margin:0 0 8px;">⬇  Download Word (.doc)</button>
      <div class="print-hint" style="padding:0 0 12px;">Opens and edits in Microsoft Word — use this for future manual changes.</div>
      <button class="print-btn" id="btn-print" style="margin:0;">🖨  Print / Save as PDF</button>
      <div class="print-hint" style="padding:8px 0 0;">In the print dialog, choose "Save as PDF" as the destination.</div>
    </div>

// ---------------- HELPERS ----------------
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function formatINR(num){
  if (num === null || num === undefined || isNaN(num)) return "0";
  num = Math.round(num);
  const s = Math.abs(num).toString();
  const last3 = s.slice(-3);
  const other = s.slice(0, -3);
  const grouped = other !== "" ? other.replace(/\B(?=(\d{2})+(?!\d)$)/g, ",") + "," + last3 : last3;
  return (num < 0 ? "-" : "") + grouped;
}

function numberToWordsIndian(num){
  if (!num || isNaN(num) || num <= 0) return "";
  num = Math.round(num);
  const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ return n<20 ? ones[n] : tens[Math.floor(n/10)] + (n%10 ? " "+ones[n%10] : ""); }
  function three(n){
    let str="";
    if(n>=100){ str += ones[Math.floor(n/100)] + " Hundred"; n%=100; if(n) str+=" "; }
    if(n) str += two(n);
    return str;
  }
  let crore = Math.floor(num/10000000); num%=10000000;
  let lakh = Math.floor(num/100000); num%=100000;
  let thousand = Math.floor(num/1000); num%=1000;
  let rest = num;
  let parts=[];
  if(crore) parts.push(three(crore)+" Crore");
  if(lakh) parts.push(three(lakh)+" Lakh");
  if(thousand) parts.push(three(thousand)+" Thousand");
  if(rest) parts.push(three(rest));
  return parts.length ? "Rupees " + parts.join(" ") + " Only" : "";
}

function formatDate(iso){
  if(!iso) return "__.__.____";
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function sectionHasAnySelected(i){
  const sel = selection[i];
  if (sel.items && sel.items.some(Boolean)) return true;
  if (sel.subsections && sel.subsections.some(sub => sub.some(Boolean))) return true;
  if (sel.custom.some(c => c.selected)) return true;
  return false;
}

const treeEl = document.getElementById("scope-tree");

function sectionAllState(i){
  const sel = selection[i];
  let flat = sel.items ? sel.items.slice() : (sel.subsections ? sel.subsections.flat() : []);
  flat = flat.concat(sel.custom.map(c => c.selected));
  if (flat.length === 0) return false;
  const allTrue = flat.every(Boolean);
  const allFalse = flat.every(v => !v);
  return allTrue ? true : (allFalse ? false : "mixed");
}

function refreshSectionCheckbox(i){
  const cb = document.getElementById("sec-cb-"+i);
  const st = sectionAllState(i);
  cb.checked = st === true;
  cb.indeterminate = st === "mixed";
}
function refreshSubCheckbox(i,j){
  const cb = document.getElementById("sub-cb-"+i+"-"+j);
  if(!cb) return;
  const arr = selection[i].subsections[j];
  const allTrue = arr.every(Boolean), allFalse = arr.every(v=>!v);
  cb.checked = allTrue;
  cb.indeterminate = !allTrue && !allFalse;
}

function renderCustomItems(i){

      <button type="button" class="custom-del-btn" title="Remove this point">\u00d7</button>`;

    r.querySelector("input").addEventListener("change", e => {
      selection[i].custom[k].selected = e.target.checked;

      selection[i].custom.splice(k, 1);
      renderCustomItems(i);
      refreshSectionCheckbox(i);
      renderPreview();
    });
  });
}

function safeFileToken(s){ return (s || "").replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,""); }

function downloadWord(){
  const htmlStr = buildWordDocument();
  const blob = new Blob(["\ufeff", htmlStr], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const fname = (safeFileToken(state.cname) || "Proposal") + "_" + (safeFileToken(state.ref) || "Quote") + ".doc";
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const C = { navy:"#2D3C61", blue:"#2674AF", ink:"#232323", gray:"#6B6B6E", line:"#d9dde3", rowline:"#eeeeee", headbg:"#EEF1F6" };

}
function listHTML(items){
  let s = `<ul style="margin:0 0 4px; padding-left:19px;">`;
  items.forEach(t => { s += `<li style="font-size:11pt; line-height:1.5; margin-bottom:5px; text-align:justify;">${esc(t)}</li>`; });
  return s + `</ul>`;
}

// Builds the full document body using inline styles + real HTML attributes
// throughout (no reliance on external CSS classes, no flexbox/grid). This is
// deliberate: it's the one guaranteed way for the SAME markup to render
// correctly on screen, in print, AND when opened as a Word document \u2014
// Word's HTML import respects inline style/width/height/bgcolor far more
// reliably than an external stylesheet.
function buildDocumentHTML(selectedSections, costWords, costDisplay){
  let html = "";

  // header: logo (left) + date/ref (right)
  html += `<table width="100%" style="width:100%; border-collapse:collapse;"><tr>
    <td style="width:60%; vertical-align:middle; border-bottom:1px solid ${C.line}; padding-bottom:12px;">
      <img src="${LOGO}" alt="logo" width="158" height="50" style="width:158px; height:50px; display:block;">
    </td>
    <td style="width:40%; text-align:right; vertical-align:middle; border-bottom:1px solid ${C.line}; padding-bottom:12px; font-size:9.5pt; color:${C.gray};">
      Date: <b style="color:${C.navy};">${formatDate(state.date)}</b>&nbsp;&nbsp;|&nbsp;&nbsp;Quote Ref No: <b style="color:${C.navy};">${esc(state.ref) || "\u2014"}</b>
    </td>
  </tr></table>`;

  // address block
  html += `<div style="font-size:11pt; line-height:1.55; margin:16px 0 14px;">
    To,<br>
    <span style="font-weight:700;">${esc(state.cname) || "[Customer Name]"}</span><br>
    ${esc(state.caddr).replace(/\n/g,"<br>") || "[Customer Address]"}
  </div>`;

  // subject \u2013 plain text, no box
  const projectTitle = state.title || "[Project Title]";
  html += `<div style="font-size:11pt; margin:0 0 16px;"><b style="text-decoration:underline;">Subject:</b> Techno-Commercial Offer for Engineering Consultancy Services \u2013 ${esc(projectTitle)}.</div>`;

  html += `<div style="font-size:11pt; margin-bottom:10px;">Dear Sir / Madam,</div>`;
  let intro = `We thank you for the opportunity and are pleased to submit our techno-commercial proposal for engineering consultancy services`;
  intro += state.area ? ` covering a total plot/site area of ${esc(state.area)}.` : `.`;
  html += `<div style="font-size:11pt; line-height:1.6; margin-bottom:10px; text-align:justify;">${intro}</div>`;
  html += `<div style="font-size:11pt; line-height:1.6; margin-bottom:10px; text-align:justify;">Our complete scope of work is presented below, followed by our commercial terms and payment schedule.</div>`;

  // scope \u2013 simple numbered headings, no colour blocks
  if (selectedSections.length === 0){
    html += `<div style="font-size:11pt; color:#b3392c; background:#fdf0ee; border:1px dashed #e2a89f; padding:10px 14px;">No scope of work items are selected. Tick items in the panel on the left to include them here.</div>`;
  } else {
    selectedSections.forEach(({sec}, idx) => {
      const num = String(idx+1).padStart(2,"0");
      html += sectionHeadingHTML(num, sec.title);
      const origIdx = SCOPE_DATA.indexOf(sec);
      if (sec.items){
        html += listHTML(sec.items.filter((_,k) => selection[origIdx].items[k]));
      }
      if (sec.subsections){
        sec.subsections.forEach((sub,j) => {
          const anySel = selection[origIdx].subsections[j].some(Boolean);
          if (!anySel) return;
          html += subHeadingHTML(sub.subtitle);
          html += listHTML(sub.items.filter((_,k) => selection[origIdx].subsections[j][k]));
        });
      }
      const customSel = selection[origIdx].custom.filter(c => c.selected).map(c => c.text);
      if (customSel.length){
        html += listHTML(customSel);
      }
    });
  }

  // commercial terms \u2013 fee stated in flowing text, not a highlighted box
  html += sectionHeadingHTML("\u20B9", "Commercial Terms");
  const wordsPart = costWords ? ` (${costWords})` : "";
  html += `<div style="font-size:11pt; line-height:1.6; margin:6px 0 16px; text-align:justify;">Our total consultancy fee for the above scope of work is <b style="color:${C.navy};">${costDisplay}</b>${wordsPart}, plus GST as applicable at the time of billing.</div>`;

  html += `<table width="100%" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin:6px 0 4px; font-size:11pt;"><tr>
      <th align="left" bgcolor="${C.headbg}" style="background:${C.headbg}; color:${C.navy}; text-align:left; padding:7px 10px; font-size:10pt; font-weight:700; border-bottom:1.5pt solid ${C.navy};">Milestone</th>
      <th align="right" bgcolor="${C.headbg}" style="background:${C.headbg}; color:${C.navy}; text-align:right; padding:7px 10px; font-size:10pt; font-weight:700; border-bottom:1.5pt solid ${C.navy};">Payment</th>
    </tr>`;
  state.payments.forEach(p => {
    const amt = state.cost ? "\u20B9" + formatINR(state.cost * (p.pct/100)) : "";
    html += `<tr>
      <td style="padding:7px 10px; border-bottom:1px solid ${C.rowline}; text-align:left;">${esc(p.label)}</td>
      <td align="right" style="padding:7px 10px; border-bottom:1px solid ${C.rowline}; text-align:right;">${p.pct}%${amt ? " &nbsp;(\u2248 "+amt+")" : ""}</td>
    </tr>`;
  });
  html += `</table>`;

  html += `<div style="font-size:11pt; margin-top:9px;"><b>Site visits:</b> ${state.visits !== null && state.visits !== undefined ? state.visits : "\u2014"} visit(s) included as part of this proposal.</div>`;

  html += `<div style="font-size:11pt; line-height:1.6; margin-top:16px; text-align:justify;">We trust the above meets your requirements. Please feel free to contact us should you need any clarification or wish to discuss the scope further. We look forward to your confirmation.</div>`;

  // signature grid \u2013 table, not flex
  html += `<table width="100%" style="width:100%; margin-top:32px; border-collapse:collapse;"><tr>
    <td style="width:50%; vertical-align:top; padding-right:16px;">
      <p style="font-weight:700; color:${C.navy}; font-size:11pt; border-bottom:1px solid ${C.navy}; padding-bottom:16px; margin:0 0 14px;">For ${esc(COMPANY.name)}</p>
      <div style="font-size:10.5pt; margin-bottom:6px;">Name: ${esc(COMPANY.signatory)}</div>
      <div style="font-size:10.5pt; margin-bottom:6px;">Designation: ${esc(COMPANY.designation)}</div>
      <div style="font-size:10.5pt;">Date: ______________</div>
    </td>
    <td style="width:50%; vertical-align:top; padding-left:16px;">
      <p style="font-weight:700; color:${C.navy}; font-size:11pt; border-bottom:1px solid ${C.navy}; padding-bottom:16px; margin:0 0 14px;">For ${esc(state.cname) || "[Customer Name]"}</p>
      <div style="font-size:10.5pt; margin-bottom:6px;">Name: ______________________</div>
      <div style="font-size:10.5pt; margin-bottom:6px;">Designation: ______________________</div>
      <div style="font-size:10.5pt;">Date: ______________</div>
    </td>
  </tr></table>`;

  html += `<table width="100%" style="width:100%; margin-top:28px; border-collapse:collapse;"><tr>
    <td bgcolor="${C.navy}" style="background:${C.navy}; color:#ffffff; font-size:9pt; text-align:center; padding:8px 10px;">${esc(COMPANY.email)} &nbsp;\u2022&nbsp; ${esc(COMPANY.web)} &nbsp;\u2022&nbsp; ${esc(COMPANY.phones)} &nbsp;|&nbsp; ${esc(COMPANY.address)}</td>
  </tr></table>`;

  return html;
}

renderPreview();
</script>
</body>
</html>
